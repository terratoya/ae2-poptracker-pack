name: Publish PopTracker pack

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build and validate release assets
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: python tools/build_release.py --tag "$RELEASE_TAG"
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          gh release create "$RELEASE_TAG" \
            .local-notes/releases/ae2-poptracker-pack-*.zip \
            .local-notes/releases/versions.json \
            --verify-tag --generate-notes --latest
